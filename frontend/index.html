<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>CyberShield AI - Enterprise SOC Platform</title>
  
  <!-- Tailwind CSS with Forms and Container Queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- SOC Design System Configuration -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#0e1417",
            "surface-dim": "#0e1417",
            "surface-bright": "#333a3d",
            "surface-container-lowest": "#090f12",
            "surface-container-low": "#161d1f",
            "surface-container": "#1a2123",
            "surface-container-high": "#242b2e",
            "surface-container-highest": "#2f3639",
            "on-surface": "#dde3e7",
            "on-surface-variant": "#bbc9cf",
            "inverse-surface": "#dde3e7",
            "inverse-on-surface": "#2b3134",
            "outline": "#859399",
            "outline-variant": "#3c494e",
            "surface-tint": "#4cd6ff",
            "primary": "#a4e6ff",
            "on-primary": "#003543",
            "primary-container": "#00d1ff",
            "on-primary-container": "#00566a",
            "inverse-primary": "#00677f",
            "secondary": "#bcc7de",
            "on-secondary": "#263143",
            "secondary-container": "#3e495d",
            "on-secondary-container": "#aeb9d0",
            "tertiary": "#ffd59c",
            "on-tertiary": "#442b00",
            "tertiary-container": "#feb127",
            "on-tertiary-container": "#6b4700",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "primary-fixed": "#b7eaff",
            "primary-fixed-dim": "#4cd6ff",
            "on-primary-fixed": "#001f28",
            "on-primary-fixed-variant": "#004e60",
            "secondary-fixed": "#d8e3fb",
            "secondary-fixed-dim": "#bcc7de",
            "on-secondary-fixed": "#111c2d",
            "on-secondary-fixed-variant": "#3c475a",
            "tertiary-fixed": "#ffddb1",
            "tertiary-fixed-dim": "#ffba49",
            "on-tertiary-fixed": "#291800",
            "on-tertiary-fixed-variant": "#624000",
            "background": "#0e1417",
            "on-background": "#dde3e7",
            "surface-variant": "#2f3639"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "sm": "0.25rem",
            "md": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "xs": "4px",
            "base": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "gutter": "16px",
            "margin": "24px"
          },
          fontFamily: {
            "headline-lg": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "title-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "mono-data": ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
            "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
            "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "mono-data": ["13px", { "lineHeight": "20px", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>

  <!-- SOC Specific CSS -->
  <link href="/css/soc.css" rel="stylesheet"/>
</head>

<body class="bg-[#0A0E14] text-on-surface font-body-md min-h-screen overflow-x-hidden">
  <!-- Subtle Background Grid -->
  <div class="fixed inset-0 cyber-grid pointer-events-none z-0 opacity-40"></div>

  <!-- Dynamic Shell Elements -->
  <div id="sidebar-container"></div>
  <div id="topbar-container"></div>

  <!-- Main Canvas -->
  <main id="main-content" class="relative z-10 ml-0 md:ml-[240px] mt-16 p-md md:p-xl min-h-[calc(100vh-64px)] pb-24">
    <!-- View will be rendered here by app.js -->
    <div class="flex items-center justify-center min-h-[400px]">
      <div class="flex flex-col items-center gap-3">
        <span class="w-8 h-8 rounded-full border-2 border-primary border-t-transparent animate-spin"></span>
        <span class="font-mono-data text-xs text-on-surface-variant">INITIALIZING CYBERSHIELD SOC ENGINE...</span>
      </div>
    </div>
  </main>

  <!-- Toast Notification Root -->
  <div id="toast-container"></div>

  <!-- Main Modular Application Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
